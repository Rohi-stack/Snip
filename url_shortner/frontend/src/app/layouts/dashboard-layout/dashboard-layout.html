<div class="dashboard">
  <!-- Mobile Overlay -->
  <div class="dashboard__overlay" [class.dashboard__overlay--open]="mobileOpen()" (click)="closeMobile()"></div>

  <!-- Sidebar -->
  <aside class="dashboard__sidebar" [class.dashboard__sidebar--open]="mobileOpen()">
    <a routerLink="/" class="dashboard__logo" (click)="closeMobile()">
      <img src="assets/branding/du-logo.png" alt="DashURL Logo" class="dashboard__logo-icon" />
      <span>DashURL<span class="dot">.</span></span>
      <button class="dashboard__close-btn" (click)="closeMobile()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </a>

    <nav class="dashboard__nav">
      <a routerLink="/dashboard/links" routerLinkActive="active" class="nav-item" (click)="closeMobile()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
        Links
      </a>
      <a routerLink="/dashboard/analytics" routerLinkActive="active" class="nav-item" (click)="closeMobile()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Analytics
      </a>
      <a routerLink="/dashboard/billing" routerLinkActive="active" class="nav-item" (click)="closeMobile()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        Billing
      </a>
      <a routerLink="/dashboard/settings" routerLinkActive="active" class="nav-item" (click)="closeMobile()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Settings
      </a>
    </nav>
    
    <div class="dashboard__sidebar-footer">
      <div class="user-profile">
        <div class="user-avatar">{{ user()?.name?.[0]?.toUpperCase() || user()?.email?.[0]?.toUpperCase() || 'U' }}</div>
        <div class="user-info">
          <span class="user-name">{{ user()?.name || 'User' }}</span>
          <span class="user-plan">{{ tierLabel() }}</span>
        </div>
      </div>
      <button class="nav-item logout-btn" (click)="logout()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Log out
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="dashboard__main">
    <header class="dashboard__header">
      <button class="dashboard__hamburger" (click)="toggleMobile()" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="header-content">
        <div class="quota-pill">
          <span class="quota-label">Daily Limit</span>
          <div class="quota-bar"><div class="quota-fill" style="width: 45%;"></div></div>
          <span class="quota-text">45 / 100</span>
        </div>
        <button class="btn btn--primary btn--sm new-link-btn" (click)="openCreateModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Create Link
        </button>
      </div>
    </header>

    <div class="dashboard__content">
      <router-outlet></router-outlet>
    </div>
  </main>

  @if (isModalOpen()) {
    <app-create-link-modal (closeModal)="closeCreateModal()" />
  }
</div>
