<div class="auth-card">

  <div class="auth-card__header">
    <h1 class="auth-card__title">Create your account</h1>
    <p class="auth-card__subtitle">Manage smart links, QR codes, and analytics from one dashboard.</p>
  </div>

  @if (errorMsg()) {
    <div class="auth-error" role="alert">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ errorMsg() }}
    </div>
  }

  <form class="auth-form" (submit)="onSubmit($event)">
    <div class="form-group">
      <label for="signup-name" class="form-label">Full name <span style="color:var(--color-text-muted);font-size:.8em">(optional)</span></label>
      <input type="text" id="signup-name" class="input" placeholder="Your name" autocomplete="name" [(ngModel)]="name" name="name" [disabled]="loading()">
    </div>
    
    <div class="form-group">
      <label for="signup-email" class="form-label">Email address</label>
      <input type="email" id="signup-email" class="input" placeholder="you@company.com" autocomplete="email" [(ngModel)]="email" name="email" [disabled]="loading()">
    </div>
    
    <div class="form-group">
      <label for="signup-password" class="form-label">Password</label>
      <input type="password" id="signup-password" class="input" placeholder="Minimum 8 characters" autocomplete="new-password" [(ngModel)]="password" name="password" [disabled]="loading()">
    </div>

    <button type="submit" id="signup-submit" class="btn btn--primary btn--lg w-full auth-submit-btn" [disabled]="loading()">
      @if (loading()) { Creating account… } @else { Sign up }
    </button>
  </form>

  <div class="auth-divider">
    <span class="auth-divider__line"></span>
    <span class="auth-divider__text">or</span>
    <span class="auth-divider__line"></span>
  </div>

  <div class="auth-socials">
    <button type="button" class="btn btn--ghost btn--lg w-full google-auth-btn"
      [disabled]="loading() || googleLoading() || appleLoading()"
      (click)="onGoogleSignIn()">
      @if (googleLoading()) {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite"><circle cx="12" cy="12" r="10" stroke-opacity=".25"/><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg>
        Signing in…
      } @else {
        <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/><path d="M1 1h22v22H1z" fill="none"/></svg>
        Continue with Google
      }
    </button>
    
    <button type="button" class="btn btn--ghost btn--lg w-full google-auth-btn apple-auth-btn"
      [disabled]="loading() || googleLoading() || appleLoading()"
      (click)="onAppleSignIn()">
      @if (appleLoading()) {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite"><circle cx="12" cy="12" r="10" stroke-opacity=".25"/><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg>
        Signing in…
      } @else {
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-.96.04-2.13.64-2.82 1.45-.6.7-1.13 1.84-.99 2.94.97.08 2.06-.52 2.82-1.33z"/></svg>
        Continue with Apple
      }
    </button>
  </div>

  <p class="auth-footer">
    Already have an account? <a routerLink="/login" class="auth-link">Log in</a>
  </p>
</div>
