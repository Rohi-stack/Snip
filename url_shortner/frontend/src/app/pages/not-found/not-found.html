<div class="not-found-container">
  
  <!-- Immersive background void with stars and radial glows -->
  <div class="void-bg" aria-hidden="true">
    <div class="star star--1"></div>
    <div class="star star--2"></div>
    <div class="star star--3"></div>
    <div class="star star--4"></div>
    <div class="star star--5"></div>
    <div class="glow-orb"></div>
  </div>

  <div class="not-found-content">
    
    <!-- Branded Mascot hanging rope & logo -->
    <div class="hanging-mascot-container">
      <div class="hanging-rope"></div>
      <img src="assets/branding/du-logo.png" alt="DashURL Logo" class="hanging-logo" />
    </div>

    <!-- Centered Branded 404 Messages -->
    <div class="error-code">404</div>
    
    <h1 class="error-title">Looks like this link got shortened too much.</h1>
    <p class="error-subtitle">This URL took a wrong turn, or this dash went nowhere into the void.</p>

    <!-- Contextual CTAs aligned to authenticated profile status -->
    <div class="actions-wrapper">
      @if (isLoggedIn()) {
        <a routerLink="/dashboard/links" class="btn btn--primary btn--lg">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          Go to Dashboard
        </a>
        <a routerLink="/" class="btn btn--ghost btn--lg">
          Back Home
        </a>
      } @else {
        <a routerLink="/" class="btn btn--primary btn--lg">
          Back Home
        </a>
        <div class="guest-actions">
          <a routerLink="/login" class="btn btn--ghost btn--lg">Log in</a>
          <a routerLink="/signup" class="btn btn--ghost btn--lg register-action-btn">Sign up</a>
        </div>
      }
    </div>

  </div>
</div>
