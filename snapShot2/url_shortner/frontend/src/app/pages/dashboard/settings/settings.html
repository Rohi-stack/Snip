<div class="page-header">
  <div>
    <h1 class="page-title">Account Settings</h1>
    <p class="page-subtitle">Manage your profile, preferences, and API keys.</p>
  </div>
</div>

<div class="settings-content">
  <div class="settings-card">
    <div class="card-header">
      <h2 class="card-title">Profile Information</h2>
    </div>
    <form class="settings-form" (submit)="$event.preventDefault()">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="input" value="Aryan">
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="input" value="aryan@example.com" disabled>
          <span class="help-text">Email address cannot be changed.</span>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn--primary">Save Changes</button>
      </div>
    </form>
  </div>

  <div class="settings-card">
    <div class="card-header">
      <h2 class="card-title">API Access</h2>
    </div>
    <div class="api-section">
      <p class="api-desc">Use this API key to authenticate your requests to the Snip API.</p>
      <div class="api-key-box">
        <input type="password" class="input" value="sk_test_1234567890abcdef" readonly>
        <button class="btn btn--ghost">Copy Key</button>
      </div>
      <button class="btn btn--ghost btn--sm text-error mt-4">Revoke Key</button>
    </div>
  </div>

  <div class="settings-card danger-zone">
    <div class="card-header">
      <h2 class="card-title text-error">Danger Zone</h2>
    </div>
    <div class="danger-content">
      <p>Once you delete your account, there is no going back. Please be certain.</p>
      <button class="btn btn--danger mt-4">Delete Account</button>
    </div>
  </div>
</div>
