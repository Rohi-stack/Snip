<div class="auth-card">


  <div class="auth-card__header">
    <h1 class="auth-card__title">Create your account</h1>
    <p class="auth-card__subtitle">Manage smart links, QR codes, and analytics from one dashboard.</p>
  </div><br><br>

  <form class="auth-form" (submit)="onSubmit($event)">
    <div class="form-group">
      <label for="email" class="form-label">Email address</label>
      <input type="email" id="email" class="input" placeholder="you@company.com" autocomplete="email">
    </div><br>
    <div class="form-group">
      <label for="password" class="form-label">Password</label>
      <input type="password" id="password" class="input" placeholder="••••••••" autocomplete="new-password">
    </div><br>
    
    <button type="submit" class="btn btn--primary btn--lg w-full mt-4">Sign up</button>
  </form><br>

  <div class="auth-divider">
    <span class="auth-divider__line"></span>
    <span class="auth-divider__text">or</span>
    <span class="auth-divider__line"></span>
  </div><br>

  <button type="button" class="btn btn--ghost btn--lg w-full google-auth-btn">
    <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/><path d="M1 1h22v22H1z" fill="none"/></svg>
    <br>Continue with Google
  </button>

  <p class="auth-footer">
    <br>
    Already have an account? <a routerLink="/login" class="auth-link">Log in</a>
  </p>
</div>
