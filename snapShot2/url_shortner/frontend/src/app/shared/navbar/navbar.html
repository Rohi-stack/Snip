<nav class="navbar" [class.navbar--scrolled]="isScrolled()">
  <div class="container navbar__inner">

    <!-- Logo -->
    <a routerLink="/" class="navbar__logo" (click)="closeMobile()">
      <svg class="navbar__logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#f97316"/>
        <path d="M20 8L12 16.5H18L12 24" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="navbar__logo-text">Snip<span class="navbar__logo-dot">.</span></span>
    </a>

    <!-- Desktop Nav Links -->
    <ul class="navbar__links">
      <li><a href="#features" (click)="closeMobile()">Features</a></li>
      <li><a routerLink="/pricing" routerLinkActive="active" (click)="closeMobile()">Pricing</a></li>
      <li><a href="#faq" (click)="closeMobile()">FAQ</a></li>
    </ul>

    <!-- Desktop Actions -->
    <div class="navbar__actions">
      @if (!isLoggedIn()) {
        <a routerLink="/login" class="btn btn--ghost btn--sm">Log in</a>
        <a routerLink="/signup" class="btn btn--primary btn--sm">Get started</a>
      } @else {
        <a routerLink="/dashboard" class="btn btn--primary btn--sm">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
      }
    </div>

    <!-- Hamburger -->
    <button
      class="navbar__hamburger"
      [class.navbar__hamburger--open]="mobileOpen()"
      (click)="toggleMobile()"
      aria-label="Toggle menu"
      id="nav-hamburger"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- Mobile Drawer Overlay -->
  <div class="navbar__overlay" [class.navbar__overlay--open]="mobileOpen()" (click)="closeMobile()"></div>

  <!-- Mobile Drawer -->
  <div class="navbar__drawer" [class.navbar__drawer--open]="mobileOpen()">
    <div class="navbar__drawer-header">
      <a routerLink="/" class="navbar__logo" (click)="closeMobile()">
        <svg class="navbar__logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#f97316"/>
          <path d="M20 8L12 16.5H18L12 24" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="navbar__logo-text">Snip<span class="navbar__logo-dot">.</span></span>
      </a>
      <button class="navbar__hamburger navbar__hamburger--open" (click)="closeMobile()" aria-label="Close menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
    <div class="navbar__drawer-inner">
      <a href="#features" class="navbar__drawer-link" (click)="closeMobile()">Features</a>
      <a routerLink="/pricing" class="navbar__drawer-link" (click)="closeMobile()">Pricing</a>
      <a href="#faq" class="navbar__drawer-link" (click)="closeMobile()">FAQ</a>
      <div class="navbar__drawer-divider"></div>
      @if (!isLoggedIn()) {
        <a routerLink="/login" class="btn btn--ghost w-full" style="justify-content:center" (click)="closeMobile()">Log in</a>
        <a routerLink="/signup" class="btn btn--primary w-full" style="justify-content:center" (click)="closeMobile()">Get started</a>
      } @else {
        <a routerLink="/dashboard" class="btn btn--primary w-full" style="justify-content:center" (click)="closeMobile()">Dashboard</a>
      }
    </div>
  </div>
</nav>
